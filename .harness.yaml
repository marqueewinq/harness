# Harness dogfooding itself
main_branch: main
worktree_dir: .worktrees

commit:
  message: "[{{proj}}] [{{epic}}] [{{task}}] {{message}}"

checks:
  test:
    run: make test
  build:
    run: make build
    needs: [test]

merge:
  require:
    checks: [build]
    review: approved
  strategy: merge
  rerun_checks: true

review:
  type: agent
  # The reviewer holds the approval token: never let it run code from the
  # branch under review (go test, make, ...). Checks already ran.
  cmd: 'claude -p --allowedTools Read Grep Glob "Bash(git diff:*)" "Bash(git log:*)" "Bash(harness review approve:*)" "Bash(harness review reject:*)" < {{prompt_file}}'
  prompt: |
    You are reviewing harness task {{task_id}}. Review this diff for:
    correctness, edge cases, test coverage, Go conventions. Comments in this
    repo state only contracts/invariants/why, never what the code does.

    Diff:
    {{diff}}

    Previous review comments:
    {{previous_comments}}

    Task description:
    {{task_description}}

    Reject only for real defects; mention nitpicks in the approve comment.
    Record your verdict by running exactly one of:
      harness review approve {{task_id}} --comment "summary"
      harness review reject {{task_id}} --comment "required changes"
