# Harness dogfooding itself
main_branch: main
worktree_dir: .worktrees

checks:
  test:
    run: make test
  build:
    run: make build
    needs: [test]

merge:
  require:
    checks: [build]
    review: approved
  strategy: merge
  rerun_checks: true

review:
  type: agent
  cmd: 'claude -p "$(cat {{prompt_file}})" --allowedTools "Bash(harness review record-review*)"'
  prompt: |
    Review this diff for: correctness, test coverage, Go conventions.

    Diff:
    {{diff}}

    Previous review comments:
    {{previous_comments}}

    Task description:
    {{task_description}}

    After reviewing, call one of:
      harness review record-review approve
      harness review record-review request-changes --comment "your comments here"
